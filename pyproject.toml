[project]
name = "research-assistant"
version = "0.1.0"
description = "Company research to sales outreach agent: grounded RAG with citations, LangGraph workflow with human approval and exactly-once send, multi-tenant FastAPI, evals with a CI regression gate."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Amrutha Pappu", email = "85633476+amrupapz@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "fastapi>=0.162.5",
    "httpx2>=2.16.0",
    "langfuse>=5",
    "langgraph>=1.2.20",
    "langgraph-checkpoint-postgres>=3.2.0",
    "openai>=3.49.0",
    "psycopg[binary]>=3.3.8",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.2",
    "uvicorn>=0.54.0",
]

[project.scripts]
ask = "research_assistant.cli:main"
agent = "research_assistant.agent:main"
api = "research_assistant.api:main"
keys = "research_assistant.auth:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]
