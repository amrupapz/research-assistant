# Alembic: versioned schema migrations (D4 M2). The database URL is NOT here: migrations/env.py
# takes it from config.py (or from the caller, e.g. tests). Migrations are plain SQL, no ORM.
#   uv run alembic current          which revision this database is at
#   uv run alembic upgrade head     apply everything not yet applied
#   uv run alembic downgrade -1     undo the last one

[alembic]
script_location = %(here)s/migrations
path_separator = os

[loggers]
keys = root,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
